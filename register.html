<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Registration | FrostByte 2025</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="snow-container">
    <canvas id="snow-canvas"></canvas>
  </div>

    <header class="site-header" role="banner">
        <div class="container header-row">
            <a class="brand" href="index.html">
                <span class="brand-icon">❄️</span> FrostByte
            </a>
            <nav class="main-nav" id="mainNav">
                <a href="index.html#home" class="nav-link">Home</a>
                <a href="index.html#mission" class="nav-link">Mission</a>
                <a href="index.html#location" class="nav-link">Location</a>
                <a href="index.html#schedule" class="nav-link">Timeline</a>
                <a href="index.html#rules" class="nav-link">Rules</a>
                <a href="index.html#sponsors" class="nav-link">Sponsors</a>
                <a href="register.html" class="nav-link btn-nav active">Register</a>
            </nav>
            <button id="menuToggle" class="menu-toggle" aria-label="Open menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <div class="section">
        <div class="container">
            <div class="register-card card reveal">
                <h2 class="section-title">Team Registration</h2>

                <form id="registerForm" class="register-form" action="https://script.google.com/macros/s/AKfycbzNNY_tSj3QJKzEwzpW9lfSMntW9e2gLe3z0ZK0sDao3dlKXo71QEwUr4QhF0g0TCppoQ/exec" method="post" enctype="multipart/form-data">

                    <div class="form-group">
                        <label for="teamName">Team Name</label>
                        <input type="text" id="teamName" name="teamName" required placeholder="e.g. fsociety">
                    </div>

                    <h3 class="form-section-title">Member 1 (Team Lead)</h3>
                    <div class="form-group">
                        <label for="name1">Full Name</label>
                        <input type="text" id="name1" name="memberName1" required>
                    </div>
                    <div class="form-group">
                        <label for="email1">Email</label>
                        <input type="email" id="email1" name="memberEmail1" required>
                    </div>
                    <div class="form-group">
                        <label for="phone1">Phone Number</label>
                        <input type="tel" id="phone1" name="memberPhone1" required pattern="[0-9]{10}" placeholder="10-digit number">
                    </div>
                    <div class="form-group">
                        <label for="college1">College Name</label>
                        <input type="text" id="college1" name="memberCollege1" required>
                    </div>
                    <div class="form-group">
                        <label for="branch1">Branch</label>
                        <input type="text" id="branch1" name="memberBranch1" required>
                    </div>
                    <div class="form-group">
                        <label for="semester1">Semester</label>
                        <input type="text" id="semester1" name="memberSemester1" required placeholder="Enter Semester">
                    </div>
                    <div class="form-group">
                        <label>ACM Member</label>
                        <div style="display: flex; gap: 20px; margin-top: 5px; color: var(--text-muted);">
                            <label><input type="radio" name="acmMember1" value="Yes" required> Yes</label>
                            <label><input type="radio" name="acmMember1" value="No" required> No</label>
                        </div>
                    </div>
			<div class="form-group">
                        <label for="memberid1">ACM Membership ID (if applicable)</label>
                        <input type="text" id="memberid1" name="memberId1" placeholder="Enter Membership ID">
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <div style="display: flex; gap: 20px; margin-top: 5px; color: var(--text-muted);">
                            <label><input type="radio" name="gender1" value="Male" required> Male</label>
                            <label><input type="radio" name="gender1" value="Female" required> Female</label>
                        </div>
                    </div>

                    <h3 class="form-section-title">Member 2</h3>
                    <div class="form-group">
                        <label for="name2">Full Name</label>
                        <input type="text" id="name2" name="memberName2" required>
                    </div>
                    <div class="form-group">
                        <label for="email2">Email</label>
                        <input type="email" id="email2" name="memberEmail2" required>
                    </div>
                    <div class="form-group">
                        <label for="phone2">Phone Number</label>
                        <input type="tel" id="phone2" name="memberPhone2" required pattern="[0-9]{10}" placeholder="10-digit number">
                    </div>
                    <div class="form-group">
                        <label for="college2">College Name</label>
                        <input type="text" id="college2" name="memberCollege2" required>
                    </div>
                    <div class="form-group">
                        <label for="branch2">Branch</label>
                        <input type="text" id="branch2" name="memberBranch2" required>
                    </div>
                    <div class="form-group">
                        <label for="semester2">Semester</label>
                        <input type="text" id="semester2" name="memberSemester2" required placeholder="Enter Semester">
                    </div>
                    <div class="form-group">
                        <label>ACM Member</label>
                        <div style="display: flex; gap: 20px; margin-top: 5px; color: var(--text-muted);">
                            <label><input type="radio" name="acmMember2" value="Yes" required> Yes</label>
                            <label><input type="radio" name="acmMember2" value="No" required> No</label>
                        </div>
                    </div>
			<div class="form-group">
                        <label for="memberid2">ACM Membership ID (if applicable)</label>
                        <input type="text" id="memberid2" name="memberId2" placeholder="Enter Membership ID">
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <div style="display: flex; gap: 20px; margin-top: 5px; color: var(--text-muted);">
                            <label><input type="radio" name="gender2" value="Male" required> Male</label>
                            <label><input type="radio" name="gender2" value="Female" required> Female</label>
                        </div>
                    </div>

                    <h3 class="form-section-title">Member 3</h3>
                    <div class="form-group">
                        <label for="name3">Full Name</label>
                        <input type="text" id="name3" name="memberName3" required>
                    </div>
                    <div class="form-group">
                        <label for="email3">Email</label>
                        <input type="email" id="email3" name="memberEmail3" required>
                    </div>
                    <div class="form-group">
                        <label for="phone3">Phone Number</label>
                        <input type="tel" id="phone3" name="memberPhone3" required pattern="[0-9]{10}" placeholder="10-digit number">
                    </div>
                    <div class="form-group">
                        <label for="college3">College Name</label>
                        <input type="text" id="college3" name="memberCollege3" required>
                    </div>
                    <div class="form-group">
                        <label for="branch3">Branch</label>
                        <input type="text" id="branch3" name="memberBranch3" required>
                    </div>
                    <div class="form-group">
                        <label for="semester3">Semester</label>
                        <input type="text" id="semester3" name="memberSemester3" required placeholder="Enter Semester">
                    </div>
                    <div class="form-group">
                        <label>ACM Member</label>
                        <div style="display: flex; gap: 20px; margin-top: 5px; color: var(--text-muted);">
                            <label><input type="radio" name="acmMember3" value="Yes" required> Yes</label>
                            <label><input type="radio" name="acmMember3" value="No" required> No</label>
                        </div>
                    </div>
			<div class="form-group">
                        <label for="memberid3">ACM Membership ID (if applicable)</label>
                        <input type="text" id="memberid3" name="memberId3" placeholder="Enter Membership ID">
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <div style="display: flex; gap: 20px; margin-top: 5px; color: var(--text-muted);">
                            <label><input type="radio" name="gender3" value="Male" required> Male</label>
                            <label><input type="radio" name="gender3" value="Female" required> Female</label>
                        </div>
                    </div>
			<!-- 🔹 QR DISPLAY -->
                <div class="form-group" style="text-align:center;">
                    <label>Scan QR Code to Pay</label>
                    <img src="images/payment-qr.jpeg" alt="Payment QR" style="max-width:250px; display: block; margin:0 auto;">
                    <p style="font-size:0.9rem;">After payment, upload the screenshot below</p>
                </div>

                <div class="form-group">
                    <label for="paymentProof">Payment Screenshot</label>
                    <input 
                    type="file" 
                    id="paymentProof" 
                    name="paymentProof" 
                    accept="image/png, image/jpeg, image/jpg" 
                    class="form-control" 
                    required>
                    <small style="color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 5px; display: block;">
                        Upload transaction receipt (JPG/PNG)
                    </small>
                </div>


                

                    <div class="form-group" style="margin-top: 30px; text-align: center;">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Initialize Sequence</button>
                    </div>

                </form>

                <div id="message" style="margin-top:20px; text-align:center; font-weight:bold; min-height: 1.5em;"></div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>© 2025 FrostByte CTF. <span class="muted">Stay Frosty.</span></p>
        </div>
    </footer>

    <script src="js/main.js"></script>

    
</body>
</html>
