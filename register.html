<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="section">
        <div class="register-card">
            <h2 class="section-title">Team Registration</h2>

            <!-- Added id="registerForm" for JS -->
            <form id="registerForm" class="register-form" action="https://script.google.com/macros/s/AKfycbzNNY_tSj3QJKzEwzpW9lfSMntW9e2gLe3z0ZK0sDao3dlKXo71QEwUr4QhF0g0TCppoQ/exec" method="post">

                <!-- Team Name -->
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input type="text" id="teamName" name="teamName" required>
                </div>

                <!-- Member 1 -->
                <h3 class="form-section-title">Member 1</h3>
                <div class="form-group">
                    <label for="name1">Full Name</label>
                    <input type="text" id="name1" name="name1" required>
                </div>
                <div class="form-group">
                    <label for="email1">Email</label>
                    <input type="email" id="email1" name="email1" required>
                </div>
                <div class="form-group">
                    <label for="phone1">Phone Number</label>
                    <input type="tel" id="phone1" name="phone1" required pattern="[0-9]{10}" placeholder="10-digit number">
                </div>
                <div class="form-group">
                    <label for="college1">College Name</label>
                    <input type="text" id="college1" name="college1" required>
                </div>
                <div class="form-group">
                    <label for="branch1">Branch</label>
                    <input type="text" id="branch1" name="branch1" required>
                </div>
                <div class="form-group">
                    <label for="semester1">Semester</label>
                    <input type="text" id="semester1" name="semester1" required placeholder="Enter Semester">
                </div>
                <div class="form-group">
                    <label>ACM Member</label>
                    <div style="display: flex; gap: 20px; margin-top: 5px;">
                        <label><input type="radio" name="acmMember1" value="Yes" required> Yes</label>
                        <label><input type="radio" name="acmMember1" value="No" required> No</label>
                    </div>
                </div>

                <!-- Member 2 -->
                <h3 class="form-section-title">Member 2</h3>
                <div class="form-group">
                    <label for="name2">Full Name</label>
                    <input type="text" id="name2" name="name2" required>
                </div>
                <div class="form-group">
                    <label for="email2">Email</label>
                    <input type="email" id="email2" name="email2" required>
                </div>
                <div class="form-group">
                    <label for="phone2">Phone Number</label>
                    <input type="tel" id="phone2" name="phone2" required pattern="[0-9]{10}" placeholder="10-digit number">
                </div>
                <div class="form-group">
                    <label for="college2">College Name</label>
                    <input type="text" id="college2" name="college2" required>
                </div>
                <div class="form-group">
                    <label for="branch2">Branch</label>
                    <input type="text" id="branch2" name="branch2" required>
                </div>
                <div class="form-group">
                    <label for="semester2">Semester</label>
                    <input type="text" id="semester2" name="semester2" required placeholder="Enter Semester">
                </div>
                <div class="form-group">
                    <label>ACM Member</label>
                    <div style="display: flex; gap: 20px; margin-top: 5px;">
                        <label><input type="radio" name="acmMember2" value="Yes" required> Yes</label>
                        <label><input type="radio" name="acmMember2" value="No" required> No</label>
                    </div>
                </div>

                <!-- Member 3 -->
                <h3 class="form-section-title">Member 3</h3>
                <div class="form-group">
                    <label for="name3">Full Name</label>
                    <input type="text" id="name3" name="name3" required>
                </div>
                <div class="form-group">
                    <label for="email3">Email</label>
                    <input type="email" id="email3" name="email3" required>
                </div>
                <div class="form-group">
                    <label for="phone3">Phone Number</label>
                    <input type="tel" id="phone3" name="phone3" required pattern="[0-9]{10}" placeholder="10-digit number">
                </div>
                <div class="form-group">
                    <label for="college3">College Name</label>
                    <input type="text" id="college3" name="college3" required>
                </div>
                <div class="form-group">
                    <label for="branch3">Branch</label>
                    <input type="text" id="branch3" name="branch3" required>
                </div>
                <div class="form-group">
                    <label for="semester3">Semester</label>
                    <input type="text" id="semester3" name="semester3" required placeholder="Enter Semester">
                </div>
                <div class="form-group">
                    <label>ACM Member</label>
                    <div style="display: flex; gap: 20px; margin-top: 5px;">
                        <label><input type="radio" name="acmMember3" value="Yes" required> Yes</label>
                        <label><input type="radio" name="acmMember3" value="No" required> No</label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-group" style="margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">Register Team</button>
                </div>
            </form>

            <!-- Success message div -->
            <div id="message" style="margin-top:20px; color:green; font-weight:bold;"></div>
        </div>
    </div>

    <!-- Minimal JS to show success message -->
    <script>
        const form = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // prevent default submission

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(text => {
                messageDiv.textContent = "Registration Successful!";
                messageDiv.style.color = "green";
                form.reset(); // clear form after submission
            })
            .catch(error => {
                messageDiv.textContent = "Error submitting the form. Please try again.";
                messageDiv.style.color = "red";
                console.error(error);
            });
        });
    </script>
</body>
</html>
